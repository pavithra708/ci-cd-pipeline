[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-pipeline"
version = "1.0.0"
description = "CI/CD Debugger Environment"
authors = [
    {name = "Team Trio", email = "pavithrarevankar70@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "openai>=1.52.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:run"
