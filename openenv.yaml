name: cicd-debugger-env
version: "1.0.0"
description: >
  A real-world OpenEnv environment where an AI agent debugs broken CI/CD pipelines.
  The agent is shown a pipeline YAML config and error log, and must identify
  the issue type and correct fix action.

tags:
  - openenv
  - ci-cd
  - debugging
  - software-engineering
  - real-world

tasks:
  - id: task_1
    difficulty: easy
    description: "Identify a missing environment variable in a CI pipeline"

  - id: task_2
    difficulty: medium
    description: "Identify a missing Python dependency causing a ModuleNotFoundError"

  - id: task_3
    difficulty: hard
    description: "Diagnose a failing integration test due to a wrong API endpoint"

  - id: task_4
    difficulty: easy
    description: "Identify YAML syntax error due to incorrect indentation"

  - id: task_5
    difficulty: medium
    description: "Identify dependency version conflict between required packages"

observation_space:
  task_id: string
  pipeline_yaml: string
  error_log: string
  hint: string (optional)

action_space:
  issue_type:
    type: string
    values: [missing_env, missing_dep, failing_test, yaml_syntax, version_conflict]
  fix_action:
    type: string
    values: [add_secret, add_numpy, fix_endpoint, fix_indentation, update_requirements]
  explanation:
    type: string
    required: false

reward:
  type: float
  range: [0.0, 1.0]
  description: >
    0.5 for correct issue_type, 0.5 for correct fix_action.
    Partial credit is awarded — not binary pass/fail.

api:
  reset: POST /reset
  step: POST /step
  state: GET /state

baseline_scores:
  task_1: 1.0
  task_2: 1.0
  task_3: 1.0